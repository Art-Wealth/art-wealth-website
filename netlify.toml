# Netlify configuration — Art Wealth
# This file tells Netlify how to deploy the site.
# It's a static HTML site, so there's no build step — Netlify just serves the files.

[build]
  publish = "."

# Sensible default headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "SAMEORIGIN"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"

# Long-term cache for static assets (CSS, JS, images, fonts)
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# PDFs cached for a day
[[headers]]
  for = "/docs/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
